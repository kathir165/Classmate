<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClassMate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --paper:#F2F4EF;
    --card:#FFFFFF;
    --ink:#16213A;
    --ink-soft:#5B6478;
    --teal:#2C8C8C;
    --teal-deep:#1F6B6B;
    --teal-wash:#E4F1EF;
    --amber:#E4A335;
    --amber-wash:#FBF0DC;
    --rose:#D6544A;
    --rose-wash:#FBE7E4;
    --line:#DEE3DA;
    --shadow: 0 1px 2px rgba(22,33,58,0.04), 0 8px 24px rgba(22,33,58,0.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
 body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Inter',sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  margin:0;
}

#app{
  width:100%;
  max-width:480px;
  min-height:100vh;
  margin:0 auto;
  background:var(--paper);
  display:flex;
  flex-direction:column;
  position:relative;
  box-shadow:0 0 40px rgba(22,33,58,0.08);
}
  .display{font-family:'Fraunces',serif;}
  .mono{font-family:'JetBrains Mono',monospace;}
  ::selection{background:var(--teal); color:#fff;}
  button{font-family:inherit; cursor:pointer;}
  input, select{font-family:inherit;}

  /* ---------- Top bar ---------- */
  .topbar{
    display:flex; align-items:center; gap:10px;
    padding:14px 16px 10px;
    flex-shrink:0;
  }
  .icon-btn{
    width:38px; height:38px; border-radius:50%; border:none; background:transparent;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
    color:var(--ink); transition:background .15s;
  }
  .icon-btn:hover{background:rgba(22,33,58,0.06);}
  .brand{
    font-family:'Fraunces',serif; font-weight:600; font-size:20px; letter-spacing:-0.02em;
    display:flex; align-items:center; gap:8px; flex:1;
  }
  .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--teal); display:inline-block;}
  .avatar{
    width:34px; height:34px; border-radius:50%; background:var(--teal);
    color:#fff; display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:13px; flex-shrink:0; border:none;
  }
  .searchbar{
    margin:0 16px 12px; padding:10px 14px; background:var(--card); border-radius:14px;
    display:flex; align-items:center; gap:10px; box-shadow:var(--shadow); flex-shrink:0;
  }
  .searchbar input{
    border:none; outline:none; background:transparent; flex:1; font-size:14px; color:var(--ink);
  }
  .searchbar input::placeholder{color:#9AA2B1;}

  /* ---------- scroll area ---------- */
  .scroll{ flex:1; overflow-y:auto; padding:4px 16px 100px; }
  .scroll::-webkit-scrollbar{width:0;}

  .section-label{
    font-size:11px; text-transform:uppercase; letter-spacing:0.09em; color:var(--ink-soft);
    font-weight:700; margin:18px 4px 8px;
  }

  /* ---------- hero next-class card ---------- */
  .hero{
    background:linear-gradient(135deg, var(--teal-deep), var(--teal));
    border-radius:22px; padding:20px; color:#fff; position:relative; overflow:hidden;
    box-shadow:var(--shadow);
  }
  .hero.live{background:linear-gradient(135deg,#B23E36,var(--rose));}
  .hero .eyebrow{font-size:11px; text-transform:uppercase; letter-spacing:0.1em; opacity:.85; font-weight:700;}
  .hero-row{display:flex; align-items:center; gap:16px; margin-top:10px;}
  .ring{
    width:64px; height:64px; border-radius:50%; flex-shrink:0;
    background:conic-gradient(#fff var(--pct,0%), rgba(255,255,255,0.25) 0);
    display:flex; align-items:center; justify-content:center;
  }
  .ring-inner{
    width:52px; height:52px; border-radius:50%; background:rgba(0,0,0,0.12);
    display:flex; align-items:center; justify-content:center; flex-direction:column;
  }
  .ring-inner .num{font-family:'Fraunces',serif; font-weight:600; font-size:17px; line-height:1;}
  .ring-inner .unit{font-size:8px; letter-spacing:.05em; opacity:.85; margin-top:1px;}
  .hero-title{font-family:'Fraunces',serif; font-size:23px; font-weight:600; line-height:1.15;}
  .hero-meta{font-size:13px; opacity:.9; margin-top:4px; display:flex; gap:10px; flex-wrap:wrap;}
  .hero-meta span{display:flex; align-items:center; gap:4px;}
  .hero-empty{font-size:14px; opacity:.9; line-height:1.5;}

  /* ---------- today strip ---------- */
  .period-row{
    display:flex; align-items:center; gap:12px; background:var(--card);
    border-radius:16px; padding:12px 14px; margin-bottom:8px; box-shadow:var(--shadow);
    border-left:3px solid transparent;
  }
  .period-row.current{border-left-color:var(--rose);}
  .period-row.done{opacity:.45;}
  .period-time{
    font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--ink-soft); width:48px; flex-shrink:0;
  }
  .period-body{flex:1; min-width:0;}
  .period-subject{font-weight:600; font-size:14.5px;}
  .period-room{font-size:12.5px; color:var(--ink-soft); margin-top:1px;}
  .badge{
    font-size:10.5px; font-weight:700; padding:3px 8px; border-radius:20px; flex-shrink:0;
    text-transform:uppercase; letter-spacing:.04em;
  }
  .badge.live{background:var(--rose-wash); color:var(--rose);}
  .badge.next{background:var(--teal-wash); color:var(--teal-deep);}

  /* ---------- homework card ---------- */
  .hw-card{
    background:var(--card); border-radius:16px; padding:14px; margin-bottom:8px; box-shadow:var(--shadow);
    display:flex; gap:12px; align-items:flex-start;
  }
  .hw-dot{width:9px; height:9px; border-radius:50%; background:var(--amber); margin-top:6px; flex-shrink:0;}
  .hw-body{flex:1; min-width:0;}
  .hw-subject{font-size:11px; font-weight:700; color:var(--amber); text-transform:uppercase; letter-spacing:.05em;}
  .hw-text{font-size:14.5px; margin-top:2px; line-height:1.4;}
  .hw-meta{font-size:11.5px; color:var(--ink-soft); margin-top:5px;}

  .empty-state{
    text-align:center; padding:36px 20px; color:var(--ink-soft);
  }
  .empty-state .glyph{font-size:30px; margin-bottom:8px;}
  .empty-state .title{font-family:'Fraunces',serif; font-size:17px; color:var(--ink); font-weight:600; margin-bottom:4px;}
  .empty-state .sub{font-size:13px; line-height:1.5;}

  /* ---------- FAB ---------- */
  .fab{
    position:absolute; right:20px; bottom:88px; width:58px; height:58px; border-radius:50%;
    background:var(--ink); color:#fff; border:none; box-shadow:0 10px 24px rgba(22,33,58,0.35);
    display:flex; align-items:center; justify-content:center; z-index:30; transition:transform .15s;
  }
  .fab:active{transform:scale(.92);}

  /* ---------- bottom tabs ---------- */
  .tabbar{
    display:flex; border-top:1px solid var(--line); background:var(--card); flex-shrink:0; z-index:20;
  }
  .tab{
    flex:1; border:none; background:transparent; padding:10px 4px 12px; display:flex; flex-direction:column;
    align-items:center; gap:3px; color:#9AA2B1;
  }
  .tab.active{color:var(--teal-deep);}
  .tab .label{font-size:10.5px; font-weight:600;}

  /* ---------- sheet / modal ---------- */
  .scrim{
    position:absolute; inset:0; background:rgba(22,33,58,0.42); z-index:40; opacity:0; pointer-events:none; transition:opacity .18s;
  }
  .scrim.show{opacity:1; pointer-events:auto;}
  .sheet{
    position:absolute; left:0; right:0; bottom:0; background:var(--card); border-radius:24px 24px 0 0;
    padding:8px 20px 24px; z-index:41; transform:translateY(100%); transition:transform .22s cubic-bezier(.32,.72,0,1);
    max-height:86vh; overflow-y:auto;
  }
  .sheet.show{transform:translateY(0);}
  .sheet-handle{width:36px; height:4px; background:var(--line); border-radius:4px; margin:8px auto 14px;}
  .sheet h2{font-family:'Fraunces',serif; font-size:21px; margin:0 0 4px; font-weight:600;}
  .sheet .desc{font-size:13px; color:var(--ink-soft); margin-bottom:16px; line-height:1.5;}

  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12px; font-weight:600; color:var(--ink-soft); margin-bottom:6px;}
  .field input, .field select, .field textarea{
    width:100%; padding:12px 14px; border-radius:12px; border:1.5px solid var(--line); font-size:15px;
    background:var(--paper); color:var(--ink); outline:none; transition:border-color .15s;
  }
  .field input:focus, .field select:focus, .field textarea:focus{border-color:var(--teal);}
  .field textarea{resize:vertical; min-height:64px;}
  .field-row{display:flex; gap:10px;}
  .field-row .field{flex:1;}

  .btn{
    width:100%; padding:14px; border-radius:14px; border:none; font-weight:700; font-size:14.5px;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .btn-primary{background:var(--ink); color:#fff;}
  .btn-primary:disabled{background:#C7CCD4; color:#fff;}
  .btn-outline{background:transparent; border:1.5px solid var(--line); color:var(--ink);}
  .btn-ghost{background:var(--teal-wash); color:var(--teal-deep);}
  .btn-danger{background:var(--rose-wash); color:var(--rose);}
  .btn-row{display:flex; gap:10px; margin-top:4px;}
  .btn-row .btn{flex:1;}
  .btn + .btn{margin-top:10px;}

  .choice-card{
    display:flex; align-items:center; gap:14px; padding:16px; border-radius:16px; border:1.5px solid var(--line);
    margin-bottom:10px; background:var(--paper);
  }
  .choice-glyph{
    width:44px; height:44px; border-radius:12px; display:flex; align-items:center; justify-content:center;
    flex-shrink:0; font-size:20px;
  }
  .choice-text .t{font-weight:700; font-size:14.5px;}
  .choice-text .d{font-size:12px; color:var(--ink-soft); margin-top:1px;}

  /* ---------- onboarding ---------- */
  .onboard{
    height:100%; display:flex; flex-direction:column; padding:40px 26px 30px; overflow-y:auto;
  }
  .onboard .mark{
    width:56px; height:56px; border-radius:16px; background:var(--ink); color:#fff;
    display:flex; align-items:center; justify-content:center; margin-bottom:22px;
  }
  .onboard h1{font-family:'Fraunces',serif; font-size:30px; font-weight:600; line-height:1.15; margin:0 0 8px;}
  .onboard p.lead{color:var(--ink-soft); font-size:14.5px; line-height:1.55; margin:0 0 28px;}

  /* ---------- timetable page ---------- */
  .page-head{display:flex; align-items:center; gap:10px; padding:4px 0 14px;}
  .page-head h1{font-family:'Fraunces',serif; font-size:24px; font-weight:600; margin:0; flex:1;}
  .daytabs{display:flex; gap:6px; overflow-x:auto; padding-bottom:12px; margin-bottom:6px;}
  .daytabs::-webkit-scrollbar{display:none;}
  .daychip{
    flex-shrink:0; padding:8px 14px; border-radius:20px; border:1.5px solid var(--line); background:var(--card);
    font-size:12.5px; font-weight:700; color:var(--ink-soft);
  }
  .daychip.active{background:var(--ink); color:#fff; border-color:var(--ink);}

  .code-box{
    background:var(--ink); border-radius:20px; padding:22px; text-align:center; color:#fff; margin-bottom:16px;
  }
  .code-box .lbl{font-size:11px; text-transform:uppercase; letter-spacing:.1em; opacity:.75; font-weight:700;}
  .code-box .code{font-family:'JetBrains Mono',monospace; font-size:30px; font-weight:700; letter-spacing:.08em; margin:6px 0 14px;}
  .qrwrap{background:#fff; padding:10px; border-radius:14px; display:inline-block;}

  .member-row{
    display:flex; align-items:center; gap:12px; background:var(--card); border-radius:14px; padding:11px 14px;
    margin-bottom:7px; box-shadow:var(--shadow);
  }
  .member-row .initial{
    width:34px; height:34px; border-radius:50%; background:var(--teal-wash); color:var(--teal-deep);
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:12.5px; flex-shrink:0;
  }
  .member-row .info{flex:1; min-width:0;}
  .member-row .name{font-weight:600; font-size:14px;}
  .member-row .rrn{font-size:11.5px; color:var(--ink-soft); font-family:'JetBrains Mono',monospace;}
  .pill{font-size:10px; font-weight:700; padding:3px 8px; border-radius:20px; background:var(--amber-wash); color:#8a5f0f; text-transform:uppercase;}

  .toast{
    position:absolute; left:50%; bottom:96px; transform:translateX(-50%); background:var(--ink); color:#fff;
    padding:11px 18px; border-radius:30px; font-size:13px; font-weight:600; z-index:60; box-shadow:var(--shadow);
    opacity:0; pointer-events:none; transition:opacity .2s, bottom .2s;
  }
  .toast.show{opacity:1; bottom:106px;}

  .link-btn{background:none;border:none;color:var(--teal-deep);font-weight:700;font-size:13px;padding:0;}
/* ============================================================
   RESPONSIVE DESIGN
   ============================================================ */

/* Small phones */
@media (max-width: 380px) {

  .topbar{
    padding:12px 12px 8px;
  }

  .searchbar{
    margin-left:12px;
    margin-right:12px;
  }

  .scroll{
    padding-left:12px;
    padding-right:12px;
    padding-bottom:90px;
  }

  .hero{
    padding:16px;
    border-radius:18px;
  }

  .hero-title{
    font-size:20px;
  }

  .hero-row{
    gap:12px;
  }

  .ring{
    width:58px;
    height:58px;
  }

  .ring-inner{
    width:48px;
    height:48px;
  }

  .onboard{
    padding:28px 20px;
  }

  .onboard h1{
    font-size:27px;
  }

  .sheet{
    padding-left:16px;
    padding-right:16px;
  }

  .field-row{
    flex-direction:column;
    gap:0;
  }
}


/* Normal phones and tablets */
@media (min-width: 481px) {

  body{
    display:flex;
    justify-content:center;
    align-items:flex-start;
  }

  #app{
    min-height:100vh;
    border-left:1px solid var(--line);
    border-right:1px solid var(--line);
  }
}


/* Larger tablets / laptops */
@media (min-width: 768px) {

  #app{
    max-width:520px;
    margin-top:20px;
    min-height:calc(100vh - 40px);
    max-height:calc(100vh - 40px);
    border-radius:24px;
    overflow:hidden;
  }

  .sheet{
    border-radius:24px;
    max-width:520px;
    left:50%;
    right:auto;
    width:100%;
    transform:translate(-50%, 100%);
  }

  .sheet.show{
    transform:translate(-50%, 0);
  }
}


/* Desktop */
@media (min-width: 1200px) {

  #app{
    max-width:560px;
  }

  .hero-title{
    font-size:25px;
  }

  .scroll{
    padding-left:20px;
    padding-right:20px;
  }
}
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://okwxykgtutlhqayykkbg.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_OUUGPwphJNehTJudz5oEew_fz7hAlGh';

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);
console.log("ClassMate Supabase:", supabaseClient);
/* ============================================================
   STORAGE HELPERS
   Standalone version: uses browser localStorage.
   For real multi-user class sharing, replace this with a backend.
   ============================================================ */
async function sGet(key, shared=false){
  try{
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : null;
  }catch(e){
    console.error('storage get failed', e);
    return null;
  }
}

async function sSet(key, value, shared=false){
  try{
    localStorage.setItem(key, JSON.stringify(value));
    return true;
  }catch(e){
    console.error('storage set failed', e);
    return false;
  }
}

/* ============================================================
   STATE
   ============================================================ */
let profile = null;          // {name, rrn, classes:[{code,name}], activeCode}
let activeClass = null;      // full class object for the active class
let view = 'loading';        // loading | onboard | home | timetable | homework | admin | members
let activeDay = null;
let notifPermission = (typeof Notification !== 'undefined') ? Notification.permission : 'unsupported';
let firedFlags = {};         // local session flags to avoid duplicate notifications
let searchQuery = '';

const DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat'];
const DAY_FULL = {Mon:'Monday',Tue:'Tuesday',Wed:'Wednesday',Thu:'Thursday',Fri:'Friday',Sat:'Saturday'};

function todayKey(){
  const idx = new Date().getDay(); // 0 Sun .. 6 Sat
  return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][idx];
}
function isWorkingDay(dayKey){ return DAYS.includes(dayKey); } // Mon-Sat, Sun off
function nextWorkingDayDate(fromDate){
  let d = new Date(fromDate);
  do{ d.setDate(d.getDate()+1); } while(!isWorkingDay(['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()]));
  d.setHours(0,0,0,0);
  return d;
}
function genCode(){
  const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let c=''; for(let i=0;i<6;i++) c+=chars[Math.floor(Math.random()*chars.length)];
  return c;
}
function initials(name){
  return (name||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
}
function timeToMin(t){ const [h,m]=t.split(':').map(Number); return h*60+m; }
function nowMin(){ const d=new Date(); return d.getHours()*60+d.getMinutes(); }
function fmtTime(t){
  const [h,m]=t.split(':').map(Number);
  const ap = h>=12?'PM':'AM'; let hh = h%12; if(hh===0) hh=12;
  return hh+':'+String(m).padStart(2,'0')+' '+ap;
}

/* ============================================================
   BOOT
   ============================================================ */
async function boot(){
  profile = await sGet('profile', false);
  if(!profile || !profile.name || !profile.rrn){
    view = 'onboard';
    render();
    return;
  }
  if(profile.activeCode){
    activeClass = await sGet('class:'+profile.activeCode, true);
  }
  activeDay = isWorkingDay(todayKey()) ? todayKey() : 'Mon';
  view = 'home';
  render();
  requestNotifPermission(false);
  setInterval(tick, 20000);
  tick();
}
boot();

async function refreshActiveClass(){
  if(profile && profile.activeCode){
    activeClass = await sGet('class:'+profile.activeCode, true);
  } else {
    activeClass = null;
  }
}

/* ============================================================
   NOTIFICATIONS
   ============================================================ */
function requestNotifPermission(userInitiated){
  if(typeof Notification === 'undefined') return;
  if(Notification.permission === 'default' && userInitiated){
    Notification.requestPermission().then(p=>{ notifPermission = p; render(); });
  } else {
    notifPermission = Notification.permission;
  }
}
function fireNotif(title, body, tag){
  if(typeof Notification === 'undefined' || Notification.permission !== 'granted') return;
  try{ new Notification(title, {body, tag}); }catch(e){}
}
function tick(){
  if(!activeClass) return;
  const day = todayKey();
  if(!isWorkingDay(day)) return;
  const periods = (activeClass.timetable && activeClass.timetable[day]) || [];
  const cur = nowMin();
  periods.forEach(p=>{
    const start = timeToMin(p.time);
    const diff = start - cur;
    const flagKey = 'class_'+day+'_'+p.time+'_'+p.subject;
    if(diff <= 5 && diff >= 0 && !firedFlags[flagKey]){
      firedFlags[flagKey] = true;
      fireNotif('Starts in '+diff+' min: '+p.subject, 'Room '+p.room, flagKey);
    }
  });
  // 6pm homework reminder
  const d = new Date();
  const hwFlag = 'hw6pm_'+d.toDateString();
  if(d.getHours()===18 && d.getMinutes()<20 && !firedFlags[hwFlag]){
    const pending = visibleHomework(activeClass);
    if(pending.length){
      firedFlags[hwFlag] = true;
      fireNotif('Homework check-in', pending.length+' task(s) due — finish up before the day ends.', hwFlag);
    }
  }
  render();
}

function visibleHomework(cls){
  if(!cls || !cls.homework) return [];
  const now = new Date();
  return cls.homework.filter(hw=>{
    const posted = new Date(hw.postedDate);
    const cutoff = nextWorkingDayDate(posted);
    return now < cutoff;
  }).sort((a,b)=> new Date(b.postedDate) - new Date(a.postedDate));
}

/* ============================================================
   RENDER ROOT
   ============================================================ */
function render(){
  const app = document.getElementById('app');
  if(view === 'onboard'){ app.innerHTML = renderOnboard(); bindOnboard(); return; }
  app.innerHTML = renderShell();
  bindShell();
}

/* ---------- ONBOARDING ---------- */
function renderOnboard(){
  return `
  <div class="onboard">
    <div class="mark">${svgLogo(26)}</div>
    <h1>Welcome to ClassMate</h1>
    <p class="lead">Your timetable, class reminders and homework, all in one place. First, let's get you registered.</p>
    <div class="field"><label>Full name</label><input id="ob-name" placeholder="e.g. Ananya Rao"></div>
    <div class="field"><label>Register number (RRN)</label><input id="ob-rrn" class="mono" placeholder="e.g. 22CS045" style="text-transform:uppercase;"></div>
    <button class="btn btn-primary" id="ob-continue" disabled>Continue</button>
    <p style="font-size:12px;color:var(--ink-soft);margin-top:16px;line-height:1.5;">You'll pick or create your class on the next step.</p>
  </div>`;
}
function bindOnboard(){
  const nameEl = document.getElementById('ob-name');
  const rrnEl = document.getElementById('ob-rrn');
  const btn = document.getElementById('ob-continue');
  function check(){ btn.disabled = !(nameEl.value.trim() && rrnEl.value.trim()); }
  nameEl.addEventListener('input', check);
  rrnEl.addEventListener('input', check);
  btn.addEventListener('click', async ()=>{
    profile = { name: nameEl.value.trim(), rrn: rrnEl.value.trim().toUpperCase(), classes: [], activeCode: null };
    await sSet('profile', profile, false);
    view = 'home';
    render();
    openSheet('classChoice');
  });
}

/* ---------- HOME ---------- */
function renderHome(){
  const day = todayKey();
  const working = isWorkingDay(day);
  const periods = working ? ((activeClass.timetable && activeClass.timetable[day]) || []).slice().sort((a,b)=>timeToMin(a.time)-timeToMin(b.time)) : [];
  const cur = nowMin();
  let liveP = null, nextP = null;
  periods.forEach(p=>{
    const s = timeToMin(p.time), e = p.endTime ? timeToMin(p.endTime) : s+50;
    if(cur>=s && cur<e) liveP = p;
    else if(!nextP && s>cur) nextP = p;
  });

  let hero;
  if(liveP){
    const s=timeToMin(liveP.time), e=liveP.endTime?timeToMin(liveP.endTime):s+50;
    const pct = Math.round(((cur-s)/(e-s))*100);
    hero = `<div class="hero live"><div class="eyebrow">Happening now</div>
      <div class="hero-row">
        <div class="ring" style="--pct:${pct}%"><div class="ring-inner"><div class="num">${e-cur}</div><div class="unit">MIN LEFT</div></div></div>
        <div><div class="hero-title">${escapeHtml(liveP.subject)}</div>
        <div class="hero-meta"><span>${iconPin()} Room ${escapeHtml(liveP.room)}</span><span>${iconClock()} ${fmtTime(liveP.time)}–${liveP.endTime?fmtTime(liveP.endTime):''}</span></div></div>
      </div></div>`;
  } else if(nextP){
    const s=timeToMin(nextP.time), diff = s-cur;
    const pct = Math.max(0, Math.min(100, Math.round((1-(diff/60))*100)));
    hero = `<div class="hero"><div class="eyebrow">Up next</div>
      <div class="hero-row">
        <div class="ring" style="--pct:${pct}%"><div class="ring-inner"><div class="num">${diff}</div><div class="unit">MIN</div></div></div>
        <div><div class="hero-title">${escapeHtml(nextP.subject)}</div>
        <div class="hero-meta"><span>${iconPin()} Room ${escapeHtml(nextP.room)}</span><span>${iconClock()} ${fmtTime(nextP.time)}</span></div></div>
      </div></div>`;
  } else {
    hero = `<div class="hero"><div class="eyebrow">${working?"That's it for today":'Weekend'}</div>
      <div class="hero-empty" style="margin-top:6px;">${working? 'No more classes today. Enjoy the rest of your day.' : "No classes scheduled — it's a day off."}</div></div>`;
  }

  const hw = visibleHomework(activeClass).filter(h=> !searchQuery || (h.text+h.subject).toLowerCase().includes(searchQuery.toLowerCase()));

  let periodsHtml = '';
  if(working && periods.length){
    periodsHtml = `<div class="section-label">Today · ${DAY_FULL[day]}</div>` + periods.map(p=>{
      const s=timeToMin(p.time), e=p.endTime?timeToMin(p.endTime):s+50;
      const state = cur>=e ? 'done' : (cur>=s&&cur<e ? 'current' : '');
      const badge = cur>=s&&cur<e ? '<span class="badge live">Live</span>' : (p===nextP ? '<span class="badge next">Next</span>' : '');
      return `<div class="period-row ${state}">
        <div class="period-time">${fmtTime(p.time)}</div>
        <div class="period-body"><div class="period-subject">${escapeHtml(p.subject)}</div><div class="period-room">Room ${escapeHtml(p.room)}</div></div>
        ${badge}
      </div>`;
    }).join('');
  }

  let hwHtml = `<div class="section-label">Homework due</div>`;
  if(hw.length){
    hwHtml += hw.map(h=>`<div class="hw-card"><div class="hw-dot"></div><div class="hw-body">
      <div class="hw-subject">${escapeHtml(h.subject)}</div>
      <div class="hw-text">${escapeHtml(h.text)}</div>
      <div class="hw-meta">Posted by ${escapeHtml(h.postedBy||'CR')} · clears next working day</div>
    </div></div>`).join('');
  } else {
    hwHtml += `<div class="empty-state" style="padding:20px;"><div class="sub">Nothing pending — you're all caught up.</div></div>`;
  }

  const notifBanner = notifPermission!=='granted' && typeof Notification!=='undefined' ? `
    <div class="hw-card" style="background:var(--teal-wash);" id="notif-banner">
      <div class="hw-dot" style="background:var(--teal-deep);"></div>
      <div class="hw-body"><div class="hw-text" style="font-weight:600;">Turn on notifications</div>
      <div class="hw-meta">Get a nudge 5 minutes before class and a 6pm homework check-in.</div>
      <button class="link-btn" id="enable-notif" style="margin-top:6px;">Enable notifications →</button></div>
    </div>` : '';

  return notifBanner + hero + periodsHtml + hwHtml;
}

/* ============================================================
   BIND EVENTS
   ============================================================ */
function bindShell(){
  document.getElementById('menu-btn').onclick = ()=> openSheet('profile');
  document.getElementById('avatar-btn').onclick = ()=> openSheet('profile');
  document.getElementById('fab-btn').onclick = ()=> openSheet('classChoice');
  document.getElementById('scrim').onclick = closeSheets;
  document.querySelectorAll('.tab').forEach(t=> t.onclick = ()=>{ view=t.dataset.tab; render(); });

  const search = document.getElementById('search-input');
  if(search) search.oninput = (e)=>{ searchQuery = e.target.value; render(); document.getElementById('search-input').focus(); document.getElementById('search-input').setSelectionRange(searchQuery.length,searchQuery.length); };

  const notifBtn = document.getElementById('enable-notif');
  if(notifBtn) notifBtn.onclick = ()=> requestNotifPermission(true);

  // Home -> no class CTA already covered by FAB

  // Timetable
  document.querySelectorAll('.daychip').forEach(c=> c.onclick=()=>{ activeDay=c.dataset.day; render(); });
  const editTT = document.getElementById('edit-tt');
  if(editTT) editTT.onclick = ()=> openSheet('editTT', ()=>{ document.getElementById('et-day').textContent = DAY_FULL[activeDay]; });
  document.querySelectorAll('[data-del-period]').forEach(b=> b.onclick = async ()=>{
    const id = b.dataset.delPeriod;
    activeClass.timetable[activeDay] = activeClass.timetable[activeDay].filter(p=>p.id!==id);
    await sSet('class:'+activeClass.code, activeClass, true);
    render();
  });

  // Homework
  const addHwBtn = document.getElementById('add-hw');
  if(addHwBtn) addHwBtn.onclick = ()=> openSheet('addHW');
  document.querySelectorAll('[data-del-hw]').forEach(b=> b.onclick = async ()=>{
    const id = b.dataset.delHw;
    activeClass.homework = activeClass.homework.filter(h=>h.id!==id);
    await sSet('class:'+activeClass.code, activeClass, true);
    render();
  });

  // Admin panel
  const goMembers = document.getElementById('go-members');
  if(goMembers) goMembers.onclick = ()=>{ view='members'; render(); };
  const goEditTT = document.getElementById('go-edit-tt');
  if(goEditTT) goEditTT.onclick = ()=>{ view='timetable'; render(); };
  const goAddHw = document.getElementById('go-add-hw');
  if(goAddHw) goAddHw.onclick = ()=> openSheet('addHW');
  const leaveBtn = document.getElementById('leave-class');
  if(leaveBtn) leaveBtn.onclick = async ()=>{
    if(!confirm('Delete "'+activeClass.name+'" for everyone? This cannot be undone.')) return;
    profile.classes = profile.classes.filter(c=>c.code!==activeClass.code);
    profile.activeCode = profile.classes.length? profile.classes[0].code : null;
    await sSet('profile', profile, false);
    await refreshActiveClass();
    view='home'; render();
    showToast('Class deleted');
  };
  if(view==='admin' && typeof QRCode !== 'undefined'){
    const holder = document.getElementById('qr-holder');
    if(holder){ holder.innerHTML=''; new QRCode(holder, {text: activeClass.code, width:120, height:120, colorDark:'#16213A', colorLight:'#ffffff'}); }
  }

  // Members
  document.querySelectorAll('[data-remove-member]').forEach(b=> b.onclick = async ()=>{
    const rrn = b.dataset.removeMember;
    activeClass.members = activeClass.members.filter(m=>m.rrn!==rrn);
    await sSet('class:'+activeClass.code, activeClass, true);
    render();
    showToast('Member removed');
  });

  bindSheets();
}

function bindSheets(){
  // class choice
  const cChoose = document.getElementById('choose-create');
  if(cChoose) cChoose.onclick = ()=> openSheet('create');
  const jChoose = document.getElementById('choose-join');
  if(jChoose) jChoose.onclick = ()=> openSheet('join');

  // create
  const ccName = document.getElementById('cc-name');
  const ccSubmit = document.getElementById('cc-submit');
  if(ccSubmit) ccSubmit.onclick = async ()=>{
    const name = ccName.value.trim();
    if(!name) return;
    const code = genCode();
    const newClass = {
      code, name, adminRrn: profile.rrn,
      timetable: {Mon:[],Tue:[],Wed:[],Thu:[],Fri:[],Sat:[]},
      members: [{name:profile.name, rrn:profile.rrn}],
      homework: []
    };
    await sSet('class:'+code, newClass, true);
    profile.classes = profile.classes || [];
    profile.classes.push({code, name});
    profile.activeCode = code;
    await sSet('profile', profile, false);
    activeClass = newClass;
    document.getElementById('cr-name').textContent = name;
    document.getElementById('cr-code').textContent = code;
    closeSheets();
    setTimeout(()=>{
      openSheet('created');
      const holder = document.getElementById('cr-qr');
      if(holder && typeof QRCode!=='undefined'){ holder.innerHTML=''; new QRCode(holder,{text:code, width:130, height:130, colorDark:'#16213A', colorLight:'#ffffff'}); }
    }, 220);
  };
  const ccDone = document.getElementById('cc-done');
  if(ccDone) ccDone.onclick = ()=>{ closeSheets(); view='home'; render(); };

  // join
  const jcSubmit = document.getElementById('jc-submit');
  if(jcSubmit) jcSubmit.onclick = async ()=>{
    const code = document.getElementById('jc-code').value.trim().toUpperCase();
    const err = document.getElementById('jc-error');
    if(!code){ return; }
    const found = await sGet('class:'+code, true);
    if(!found){ err.style.display='block'; return; }
    err.style.display='none';
    if(!found.members.some(m=>m.rrn===profile.rrn)){
      found.members.push({name:profile.name, rrn:profile.rrn});
      await sSet('class:'+code, found, true);
    }
    profile.classes = profile.classes || [];
    if(!profile.classes.some(c=>c.code===code)) profile.classes.push({code, name:found.name});
    profile.activeCode = code;
    await sSet('profile', profile, false);
    activeClass = found;
    closeSheets();
    view='home'; render();
    showToast('Joined '+found.name);
  };

  // edit timetable
  const etSubmit = document.getElementById('et-submit');
  if(etSubmit) etSubmit.onclick = async ()=>{
    const time = document.getElementById('et-time').value;
    const end = document.getElementById('et-end').value;
    const subject = document.getElementById('et-subject').value.trim();
    const room = document.getElementById('et-room').value.trim();
    if(!time || !subject || !room) return;
    const id = 'p'+Date.now();
    activeClass.timetable[activeDay] = activeClass.timetable[activeDay] || [];
    activeClass.timetable[activeDay].push({id, time, endTime:end||undefined, subject, room});
    await sSet('class:'+activeClass.code, activeClass, true);
    closeSheets();
    view='timetable'; render();
    showToast('Period added');
  };

  // add homework
  const hwSubmit = document.getElementById('hw-submit');
  if(hwSubmit) hwSubmit.onclick = async ()=>{
    const subject = document.getElementById('hw-subject').value.trim();
    const text = document.getElementById('hw-text').value.trim();
    if(!subject || !text) return;
    activeClass.homework = activeClass.homework || [];
    activeClass.homework.push({id:'h'+Date.now(), subject, text, postedDate: new Date().toISOString(), postedBy: profile.name});
    await sSet('class:'+activeClass.code, activeClass, true);
    closeSheets();
    view='homework'; render();
    showToast('Homework posted');
  };

  // profile sheet
  document.querySelectorAll('[data-switch-class]').forEach(el=> el.onclick = async ()=>{
    profile.activeCode = el.dataset.switchClass;
    await sSet('profile', profile, false);
    await refreshActiveClass();
    closeSheets();
    view='home'; render();
  });
  const addClassBtn = document.getElementById('profile-add-class');
  if(addClassBtn) addClassBtn.onclick = ()=> openSheet('classChoice');
}

/* ============================================================
   SHEET / TOAST HELPERS
   ============================================================ */
function openSheet(id, after){
  closeSheets();
  requestAnimationFrame(()=>{
    document.getElementById('scrim').classList.add('show');
    const el = document.getElementById('sheet-'+id);
    if(el) el.classList.add('show');
    if(after) after();
  });
}
function closeSheets(){
  document.querySelectorAll('.sheet').forEach(s=>s.classList.remove('show'));
  const scrim = document.getElementById('scrim');
  if(scrim) scrim.classList.remove('show');
}
let toastTimer;
function showToast(msg){
  const t = document.getElementById('toast');
  if(!t) return;
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> t.classList.remove('show'), 2200);
}
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
